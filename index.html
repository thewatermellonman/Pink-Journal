<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <p>Your cute little</p>
        <h1>Pink Journal</h1>
    </header>

    <nav class="toolbar">
        <button id="addPhoto">Add Photo</button>
        <div class="slide">
            <label for="sizeSlider">Sticker Size</label>
            <input
                type="range"
                id="sizeSlider"
                min="30"
                max="300"
                value="100"
                class="slider">
        </div>
        <button id="addText">Add Text</button>
    </nav>

    <main class="editor">
        <aside class="sticker-library">
            <h2>Sticker Book</h2>

            <div class="sticker-page">
                <img class="sticker-option" id="sticker1" draggable="false" src="./stickers/sticker1.png">
                <img class="sticker-option" id="sticker2" draggable="false" src="./stickers/sticker2.png">
                <img class="sticker-option" id="sticker3" draggable="false" src="./stickers/sticker3.png">
                <img class="sticker-option" id="sticker4" draggable="false" src="./stickers/sticker4.png">
                <img class="sticker-option" id="sticker5" draggable="false" src="./stickers/sticker5.png">
                <img class="sticker-option" id="sticker6" draggable="false" src="./stickers/sticker6.png">
                <img class="sticker-option" id="sticker7" draggable="false" src="./stickers/sticker7.png">
                <img class="sticker-option" id="sticker8" draggable="false" src="./stickers/sticker8.png">
                <img class="sticker-option" id="sticker9" draggable="false" src="./stickers/sticker9.png">
                <img class="sticker-option" id="sticker10" draggable="false" src="./stickers/sticker10.png">
            </div>
        </aside>

        <section class="workspace">
            <div class="page">
                
            </div>
        </section>
    </main>

    <div class="finalbutt">
        <button id="undo">Undo</button>
        <button id="save">Save</button>
    </div>

    <section class="text">
        <h1>The quick brown fox</h1>
        <h2>The quick brown fox</h2>
        <h3>The quick brown fox</h3>
        <h4>The quick brown fox</h4>
    </section>
</body>
</html>

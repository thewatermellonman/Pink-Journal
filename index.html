<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <p>Your cute little</p>
        <h1>Pink Journal</h1>
    </header>

    <nav class="toolbar">
        <button id="addPhoto">Add Photo</button>
        <button id="addSticker">Add Sticker</button>
        <button id="addText">Add Text</button>
    </nav>

    <section class="workspace">
        <div class="page">
            <div class="draggable" id="testSticker">
                🎀
            </div>
        </div>
    </section>

    <div class="finalbutt">
        <button id="undo">Undo</button>
        <button id="save">Save</button>
    </div>

    <section class="text">
        <h1>The quick brown fox</h1>
        <h2>The quick brown fox</h2>
        <h3>The quick brown fox</h3>
        <h4>The quick brown fox</h4>
    </section>
</body>
</html>
